name: G925 X off-device engine regression lab

# Runs without a phone. Correctness and software Vulkan API smoke tests only.
# No CI host or software Vulkan renderer can prove Mali-G925 mobile frame rate.
on:
  pull_request:
    branches: [feature/g925-v244-rebased-index-batching]
  push:
    branches: [feature/g925x-device-engine-lab-v1, feature/g925x-index-fastpath-v04, feature/g925x-texture-neon-v05]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g925x-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-cpu-replay:
    name: C++ guest-index replay + POCO device policy + host benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify compiler toolchain
        run: |
          clang++ --version
          javac -version
      - name: Verify shared edition metadata and legacy startup checks
        run: |
          python tools/test_g925_fast_apk.py
          python tools/test_g925_official_clean.py
          python tools/test_g925_native_frametime_v2.py
          python tools/test_g925_pipeline_stability_v21.py
          python tools/test_g925_sustained_fps_v22.py
          python tools/test_g925_paint_telemetry_v23.py
          python tools/test_g925_native_bottleneck_v24.py
          python tools/test_g925_batched_cpu_v25.py
          python tools/test_g925_stable_16ms_v26.py
          python tools/test_g925_native_app_v1.py
      - name: Run exact 16/32-bit renderer rebase replay (C++)
        env:
          G925_TEST_CXX: clang++
        run: python tools/test_g925_rebased_index_batch_v244.py
      - name: Replay G925 X adaptive native CPU scheduling (and full-quality Android defaults)
        env:
          G925_TEST_CXX: clang++
        run: python tools/test_g925x_adaptive_sparse.py
      - name: Verify G925 X Android identity, POCO hardware detection, host CPU index benchmark
        env:
          G925_TEST_CXX: clang++
          G925X_BENCHMARK: '1'
        run: python tools/test_g925x_lab.py

  texture-palette:
    name: Exact BC texture palette replay (scalar and ARM64 NEON)
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and compare 200000 palette blocks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror tools/test_g925x_bc_palette.cpp -o /tmp/g925x-bc
          /tmp/g925x-bc
      - name: Replay exact shader constant writes and descriptor cache capacity
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror tools/test_g925x_frame_hotpaths.cpp -o /tmp/g925x-frame
          /tmp/g925x-frame
      - name: Replay masked restart index conversion including SIMD tails
        run: python3 tools/test_g925_constant_index_v220.py

  software-vulkan:
    name: Vulkan loader smoke (Mesa lavapipe; NOT phone GPU FPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 vulkan-tools mesa-vulkan-drivers
      - name: Enumerate the software Vulkan device
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Vulkan ICDs:"
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print | sort
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*' -print -quit)"
          if [[ -n "$ICD" ]]; then
            export VK_ICD_FILENAMES="$ICD"
            echo "Selected Lavapipe ICD: $ICD"
          fi
          vulkaninfo --summary | tee software-vulkan.txt
          grep -Eiq 'llvmpipe|lavapipe|software' software-vulkan.txt
          echo "PASS: software Vulkan device enumerated, not a Mali-G925 FPS measurement"
