name: Android APK

# Builds the Android APK on a Windows runner, the platform the Android scripts
# in os/android/scripts were written and tested on (Git Bash + the NDK).
# Download the result from the run's "Artifacts" section.
#
# Full builds still compile the whole engine when native sources change.
# Java-only mode reuses verified native libraries from a previous successful APK
# of THIS repository. PR updates select it automatically only after the source
# compatibility guard passes; manual builds can still request full compilation.

on:
  push:
    branches: [feature/g925-stable-16ms-v26]
    # Changes that cannot affect the APK do not start a build: documentation,
    # images for the README, and the other workflows.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/repository-checks.yml'
  # Build a child branch against the verified 2.6 base so GitHub permits
  # restoring that base branch's compiler cache (sibling push builds cannot).
  pull_request:
    branches: [feature/g925-stable-16ms-v26]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      gpu:
        description: 'GPU family the APK defaults to'
        type: choice
        options: [mali, adreno]
        default: mali
      cpu:
        description: 'CPU target: compatible = all phones; armv9 = Dimensity 8400 and newer only (faster, crashes on older phones)'
        type: choice
        options: [compatible, armv9]
        default: armv9
      build_mode:
        description: 'Full: native engine compile. java-only: reuse native code from compatible completed APK'
        type: choice
        options: [full, java-only]
        default: full
      base_run_id:
        description: 'Required for java-only: successful Android APK GitHub Actions run number (numeric ID)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Select verified full or Java-only build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_mode: ${{ steps.mode.outputs.build_mode }}
      base_run_id: ${{ steps.mode.outputs.base_run_id }}
    steps:
      - name: Checkout build guard at the exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/validate_g925_fast_apk.py

      - name: Select build mode from verified successful artifacts
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          G925_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          G925_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          G925_REQUESTED_MODE: ${{ inputs.build_mode || 'full' }}
          G925_BASE_RUN_ID: ${{ inputs.base_run_id }}
          LIBERTY_GPU: ${{ inputs.gpu || 'mali' }}
          LIBERTY_CPU: ${{ inputs.cpu || 'armv9' }}
        run: python3 tools/validate_g925_fast_apk.py --select-mode

  apk:
    needs: plan
    if: ${{ needs.plan.outputs.build_mode == 'full' }}
    name: APK (${{ inputs.gpu || 'mali' }}, ${{ inputs.cpu || 'armv9' }})
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      LIBERTY_GPU: ${{ inputs.gpu || 'mali' }}
      LIBERTY_CPU: ${{ inputs.cpu || 'armv9' }}
      NDK_VER: 29.0.14206865
      STRIP: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: 'g925-ndk29-v1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Allow long paths
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate official-original engine, one-click clean recovery and fast APK
        run: |
          python tools/test_g925_fast_apk.py
          python tools/test_g925_official_clean.py
          python tools/test_g925_native_frametime_v2.py
          python tools/test_g925_pipeline_stability_v21.py
          python tools/test_g925_sustained_fps_v22.py
          python tools/test_g925_paint_telemetry_v23.py
          python tools/test_g925_native_bottleneck_v24.py
          python tools/test_g925_batched_cpu_v25.py
          python tools/test_g925_stable_16ms_v26.py

      - name: Install CMake and Ninja
        run: python -m pip install 'cmake>=3.29,<5' ninja

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select host C++ toolchain for executable regressions
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run C++ state replay and Java profile regressions
        env:
          G925_TEST_CXX: clang++
        run: |
          python tools/test_g925_render_state_v27.py
          python tools/test_g925_draw_lookup_v28.py
          python tools/test_g925_cache_batch_v214.py
          python tools/test_g925_memo_resolve_v215.py
          python tools/test_g925_render_hotpaths_v216.py
          python tools/test_g925_index_upload_v29.py
          python tools/test_g925_present_overlap_v212.py
          python tools/test_g925_profile_report_v27.py

      - name: Install Android SDK platform and NDK r29
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VER" "platforms;android-35" "build-tools;35.0.0"

      - name: Replay G925 draw preparation with NDK Vulkan headers
        env:
          G925_TEST_CXX: clang++
        run: python tools/test_g925_draw_preparation_v211.py

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ github.sha }}
          restore-keys: |
            android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-
            android-${{ env.LIBERTY_GPU }}-

      - name: Install content-addressed C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Export GitHub Actions cache access to sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch pinned dependencies and apply patches
        run: python tools/setup_repo.py

      - name: Build the Vulkan driver proxy
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash os/android/scripts/build_driver_proxy.sh

      # The slow step. Its own timeout leaves time for the cache save below,
      # so a build that runs out of time keeps its progress for the next run.
      - name: Build the native libraries
        timeout-minutes: 320
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash os/android/scripts/build_native.sh

      - name: Report C++ compilation cache hits
        if: always()
        shell: bash
        run: |
          if [ -n "${SCCACHE_PATH:-}" ]; then
            "$SCCACHE_PATH" --show-stats | tee sccache-stats.txt
            "$SCCACHE_PATH" --show-stats --stats-format=json > sccache-stats.json
            {
              echo '### C++ compiler cache'
              echo '```text'
              cat sccache-stats.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compiler cache statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g925-build-cache-statistics
          path: sccache-stats.*
          if-no-files-found: warn
          retention-days: 30

      - name: Save build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ github.sha }}

      - name: Package the APK
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh debug

      - name: Name the APK
        run: |
          VERSION="$(grep -o 'versionName *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          [ "$LIBERTY_GPU" = "mali" ] && VERSION="$VERSION-mali"
          SUFFIX="$(grep -o 'versionSuffix *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          VERSION="$VERSION$SUFFIX"
          [ "$LIBERTY_CPU" = "armv9" ] && VERSION="$VERSION-armv9"
          cp os/android/app/build/outputs/apk/debug/app-debug.apk "LibertyRecompAndroid-$VERSION.apk"
          echo "APK_NAME=LibertyRecompAndroid-$VERSION.apk" >> "$GITHUB_ENV"
          ls -la LibertyRecompAndroid-*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

  fast-apk:
    needs: plan
    if: ${{ needs.plan.outputs.build_mode == 'java-only' }}
    name: Fast APK (reuse verified Mali ARMv9 native libraries)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LIBERTY_GPU: ${{ inputs.gpu || 'mali' }}
      LIBERTY_CPU: ${{ inputs.cpu || 'armv9' }}
      G925_BASE_RUN_ID: ${{ needs.plan.outputs.base_run_id }}
      G925_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NDK_VER: 29.0.14206865
      STRIP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Allow long paths
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check fast-mode implementation and launcher configuration
        run: |
          python tools/test_g925_fast_apk.py
          python tools/test_g925_official_clean.py
          python tools/test_g925_native_frametime_v2.py
          python tools/test_g925_pipeline_stability_v21.py
          python tools/test_g925_sustained_fps_v22.py
          python tools/test_g925_paint_telemetry_v23.py
          python tools/test_g925_native_bottleneck_v24.py
          python tools/test_g925_batched_cpu_v25.py
          python tools/test_g925_stable_16ms_v26.py

      - name: Verify previous APK matches native sources in this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/validate_g925_fast_apk.py

      - name: Download verified previous native APK
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.plan.outputs.base_run_id }}
          pattern: LibertyRecompAndroid-*
          merge-multiple: true
          path: out/fast-apk
          github-token: ${{ github.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packaging dependencies
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test final capture settings across separate Java processes
        run: python tools/test_g925_profile_report_v27.py

      - name: Prepare pinned SDL Java dependency sources
        run: |
          python tools/setup_repo.py
          python os/android/scripts/materialize_symlinks.py

      - name: Restore native libraries and title assets from compatible APK
        run: |
          python tools/stage_g925_apk_native.py \
            --artifact-directory out/fast-apk \
            --app-directory os/android

      - name: Package Java-only changes into a new APK
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh debug

      - name: Name the APK
        run: |
          VERSION="$(grep -o 'versionName *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          [ "$LIBERTY_GPU" = "mali" ] && VERSION="$VERSION-mali"
          SUFFIX="$(grep -o 'versionSuffix *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          VERSION="$VERSION$SUFFIX"
          [ "$LIBERTY_CPU" = "armv9" ] && VERSION="$VERSION-armv9"
          cp os/android/app/build/outputs/apk/debug/app-debug.apk "LibertyRecompAndroid-$VERSION.apk"
          echo "APK_NAME=LibertyRecompAndroid-$VERSION.apk" >> "$GITHUB_ENV"
          ls -la LibertyRecompAndroid-*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
